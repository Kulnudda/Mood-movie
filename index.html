<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Movie - เลือกหนังตามอารมณ์คุณ</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">🎬 Mood Movie</div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>วันนี้คุณรู้สึกอย่างไร?</h1>
            <p>เลือกอารมณ์หรือพิมพ์ความรู้สึกของคุณ แล้วระบบจะแนะนำหนังที่ใช่มาให้ทันที</p>
        </div>

        <!-- Custom Mood Input Box -->
        <div class="custom-mood-section">
            <input type="text" id="userCurrentMood" placeholder="พิมพ์อารมณ์ของคุณตอนนี้ เช่น เหงาๆ อยากหาเพื่อนคุย, อยากตื่นเต้น...">
            <button onclick="searchByCustomMood()">ค้นหาหนังตามใจฉัน</button>
        </div>

        <!-- Filter Buttons -->
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterMovies('all', event)">ทั้งหมด</button>
            <button class="filter-btn" onclick="filterMovies('เศร้าซึ้ง', event)">เศร้าซึ้ง 😭</button>
            <button class="filter-btn" onclick="filterMovies('ตื่นเต้น/ลุ้นระทึก', event)">ตื่นเต้น/ลุ้นระทึก 🔥</button>
            <button class="filter-btn" onclick="filterMovies('ตลก/คลายเครียด', event)">ตลก/คลายเครียด 😂</button>
            <button class="filter-btn" onclick="filterMovies('โรแมนติก', event)">โรแมนติก ❤️</button>
        </div>

        <!-- Movie Display Grid -->
        <div class="movie-grid" id="movieGrid">
            <!-- หนังจะถูกแสดงผ่าน JavaScript -->
        </div>

        <!-- Form Add Movie to Google Sheets -->
        <div class="form-section">
            <h2>➕ เสนอแนะภาพยนตร์ที่คุณชื่นชอบ</h2>
            <form id="movieForm" onsubmit="submitToGoogleSheet(event)">
                <div class="form-group">
                    <label>ชื่อภาพยนตร์</label>
                    <input type="text" id="movieTitle" required placeholder="เช่น หลานม่า">
                </div>
                <div class="form-group">
                    <label>อารมณ์ของหนัง</label>
                    <select id="movieMood">
                        <option value="เศร้าซึ้ง">เศร้าซึ้ง</option>
                        <option value="ตื่นเต้น/ลุ้นระทึก">ตื่นเต้น/ลุ้นระทึก</option>
                        <option value="ตลก/คลายเครียด">ตลก/คลายเครียด</option>
                        <option value="โรแมนติก">โรแมนติก</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>คะแนน (เต็ม 10)</label>
                    <input type="number" id="movieRating" min="1" max="10" step="0.1" required placeholder="เช่น 9.5">
                </div>
                <div class="form-group">
                    <label>รีวิวสั้นๆ</label>
                    <textarea id="movieReview" required placeholder="เขียนรีวิวสั้นๆ เกี่ยวกับหนังเรื่องนี้..."></textarea>
                </div>
                <button type="submit" class="submit-btn">ส่งข้อมูลเข้า Google Sheets</button>
                <p id="loading-msg">กำลังส่งข้อมูล...</p>
            </form>
        </div>
    </div>

    <!-- Modal สำหรับดูข้อมูลรายละเอียดหนัง -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2>
            <p id="modalMood" class="movie-mood" style="display:inline-block; margin: 10px 0;"></p>
            <p id="modalRating" style="color: #f5c518; font-weight: 600; margin-bottom: 10px;"></p>
            <p id="modalReview" style="color: var(--text-gray); line-height: 1.6;"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
